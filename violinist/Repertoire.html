  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{ "accent": "#4FA6B5", "density": "regular", "lang": "en" }/*EDITMODE-END*/;
    function deriveAccent2(hex){
      const h = hex.replace("#","");
      const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
      const f = (v)=>Math.max(0,Math.round(v*0.7));
      const t = (v)=>v.toString(16).padStart(2,"0");
      return `#${t(f(r))}${t(f(g))}${t(f(b))}`;
    }
    Object.assign(window, { TWEAK_DEFAULTS, deriveAccent2 });
  </script>
